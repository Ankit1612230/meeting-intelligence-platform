spring.application.name=analysis-service
server.port=8083
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=analysis-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.meetingintelligence.analysis_service.event.AnalysisRequestedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.meetingintelligence.analysis_service.event
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer